name: Build and Release Android APK

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.3)'
        required: true
        type: string
      # callback_url:
      #   description: 'URL to notify when the build is finished'
      #   required: true
      #   type: string
      # callback_token:
      #   description: 'Secure token for callback authorization'
      #   required: true
      #   type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Update Application Version Name and Code
        run: |
          cd frontend
          python update_version.py ${{ github.event.inputs.version }}

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Web Bundle
        run: |
          cd frontend
          npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187473751e9f7839333939626500445d8b7\n8933bad161af4178b1185d1a37fbf41ea5269c55\n84831b9409646a233e334476b7e09a9a1309e8e4\n601085b94cd77f0b54ff86406955449f33bc6124\n33b6a2b649204008290f83f088d21c373b9d1435\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a233e334476b7e09a9a1309e8e4\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Synchronize Capacitor to Android
        run: |
          cd frontend
          npx cap sync android

      - name: Decode Release Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > frontend/android/app/release.keystore
          else
            echo "Generating fallback release keystore..."
            keytool -genkey -v -keystore frontend/android/app/release.keystore -alias smartattendance -keyalg RSA -keysize 2048 -validity 10000 -storepass smartattendance123 -keypass smartattendance123 -dname "CN=SmartAttendance, OU=Dev, O=SmartAttendance, L=City, S=State, C=IN"
          fi

      - name: Build Signed Release APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Create GitHub Release and Upload APK
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path="frontend/android/app/build/outputs/apk/release/app-release.apk"
          version_tag="v${{ github.event.inputs.version }}"
          
          echo "Processing Release for $version_tag"
          if gh release view "$version_tag" >/dev/null 2>&1; then
            echo "Release $version_tag already exists. Uploading new APK asset with --clobber..."
            gh release upload "$version_tag" "$apk_path" --clobber
          else
            echo "Creating Release $version_tag and uploading APK..."
            gh release create "$version_tag" "$apk_path" \
              --title "Release $version_tag" \
              --notes "Automated build of version $version_tag."
          fi
            
          download_url="https://github.com/${{ github.repository }}/releases/download/${version_tag}/app-release.apk"
          echo "download_url=$download_url" >> $GITHUB_ENV

      # - name: Send Success Callback to Backend
      #   if: success()
      #   run: |
      #     curl -X POST "${{ github.event.inputs.callback_url }}" \
      #       -H "Content-Type: application/json" \
      #       -d '{
      #         "status": "success",
      #         "version": "${{ github.event.inputs.version }}",
      #         "download_url": "${{ env.download_url }}",
      #         "token": "${{ github.event.inputs.callback_token }}"
      #       }'

      # - name: Send Failure Callback to Backend
      #   if: failure()
      #   run: |
      #     curl -X POST "${{ github.event.inputs.callback_url }}" \
      #       -H "Content-Type: application/json" \
      #       -d '{
      #         "status": "failed",
      #         "version": "${{ github.event.inputs.version }}",
      #         "error": "GitHub Actions build pipeline failed. Please check build logs for error details.",
      #         "token": "${{ github.event.inputs.callback_token }}"
      #       }'
