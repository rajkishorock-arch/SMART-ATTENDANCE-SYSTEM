name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier inactivity sleep (15-min limit)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard

jobs:
  keep-alive:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check Render wake endpoint
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --output ping.json --write-out 'HTTP %{http_code} after %{time_total}s\n' \
            https://smart-attendance-system-1-mvwa.onrender.com/api/v1/health/ping
          jq -e '.ok == true' ping.json
